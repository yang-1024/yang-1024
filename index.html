<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0e12"><title>yc — instinctBoy</title>
<style>
:root{color-scheme:dark;--bg:#0b0e12;--panel:#11161d;--line:#222b35;--muted:#91a0ae;--text:#edf2f5;--green:#a3e635}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#283b29 0,transparent 43%),var(--bg);color:var(--text);font:16px/1.6 Inter,"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:28px}.card{width:min(100%,760px);border:1px solid var(--line);background:linear-gradient(145deg,#151b22f2,#0f1319f5);border-radius:26px;padding:clamp(28px,7vw,64px);box-shadow:0 30px 100px #0008}.top{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:14px;letter-spacing:.08em;text-transform:uppercase}.dot{width:9px;height:9px;background:var(--green);border-radius:50%;box-shadow:0 0 18px #a3e677}.avatar{margin:56px 0 24px;width:72px;height:72px;border-radius:22px;display:grid;place-items:center;background:#a3e635;color:#15200b;font-weight:800;font-size:25px;letter-spacing:-.06em;transform:rotate(-4deg)}h1{font-size:clamp(54px,11vw,94px);letter-spacing:-.075em;line-height:.95;margin:0;font-weight:750}.handle{color:var(--green);font-size:18px;margin-top:16px}.intro{margin:34px 0 0;color:#c0cbd4;font-size:18px;max-width:490px}.rule{height:1px;background:var(--line);margin:42px 0 24px}.foot{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}.role{color:var(--text);font-size:14px}.arrow{color:var(--green);font-size:18px}@media(max-width:520px){.card{border-radius:20px}.avatar{margin-top:44px}.foot{align-items:flex-start;gap:12px;flex-direction:column}}
</style></head><body><main class="card"><div class="top"><span class="dot"></span> Personal page <span>·</span> 你好，欢迎来访</div><div class="avatar">yc</div><h1>你好，我是 yc<span style="color:var(--green)">.</span></h1><div class="handle">@instinctBoy</div><p class="intro">一名程序员，喜欢把想法写成代码，也持续探索值得解决的新问题。</p><div class="rule"></div><div class="foot"><span class="role">程序员 <span style="color:#52606c">/</span> Developer</span><span>保持好奇，持续创造 <span class="arrow">↗</span></span></div></main></body></html>
